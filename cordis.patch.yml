# ============================================================================
# dsh-roco-daily —— DSH bundle patch
# ============================================================================
# 挂载声明：DSH 启动时把本插件插进 profile 的配置树。
# `name:` 必须与安装后的包名完全一致，否则表现为「装上了但没反应」。
#
# 安装（本地）：
#   dsh plugin --profile desktop add "link:C:\path\to\dsh-roco-daily"
# ============================================================================

- insert:
    - id: roco-daily
      name: dsh-roco-daily
